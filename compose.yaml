version: "3.9"

services:
  api:
    build:
      context: ./api
    container_name: matrix-api
    ports:
      - "8765:8765"
    environment:
      DATABASE_URL: postgresql://matrix:matrix@postgres:5432/matrix
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-super-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8765"
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    container_name: matrix-worker
    environment:
      DATABASE_URL: postgresql://matrix:matrix@postgres:5432/matrix
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "rq worker matrix --url ${REDIS_URL}"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: matrix-postgres
    environment:
      POSTGRES_DB: matrix
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: matrix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: matrix-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
